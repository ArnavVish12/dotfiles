general {
    hide_cursor = true
    grace = 5
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

# Arch logo
image {
    monitor =
    path = /usr/share/pixmaps/archlinux-logo.png
    size = 130
    rounding = 24
    border_size = 2
    border_color = rgba(23,147,209,ee)
    position = 0, 235
    halign = center
    valign = center
}

label {
    monitor =
    text = A R C H   L I N U X
    font_size = 20
    font_family = FreeSans
    color = rgba(23,147,209,ff)
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000, date '+%I:%M %p']
    font_size = 84
    font_family = monospace
    color = rgba(230,230,230,ff)
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000, date '+%A, %d %B']
    font_size = 20
    font_family = FreeSans
    color = rgba(180,180,180,ff)
    position = 0, -55
    halign = center
    valign = center
}

label {
    monitor =
    text = enter password or perish
    font_size = 16
    font_family = FreeSans
    color = rgba(150,150,150,ff)
    position = 0, -125
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(23,147,209,ee)
    inner_color = rgba(20,20,20,cc)
    font_color = rgba(230,230,230,ff)
    font_family = FreeSans
    fade_on_empty = true
    placeholder_text = <i>password...</i>
    hide_input = false
    rounding = 16
    check_color = rgba(0,255,153,ee)
    fail_color = rgba(255,60,60,ee)
    fail_text = <i>try again ($ATTEMPTS)</i>
    capslock_color = rgba(255,200,0,ee)
    position = 0, -210
    halign = center
    valign = center
}

# Escalating roast on failed logins. Reads pam_faillock (source=hyprlock only);
# empty until first wrong password, resets when you finally get it right.
label {
    monitor =
    text = cmd[update:1000, ~/.config/hypr/roast.sh]
    color = rgba(255,60,60,ee)
    font_size = 15
    font_family = monospace
    position = 0, -265
    halign = center
    valign = center
}

label {
    monitor =
    text = 100% windows-free
    font_size = 14
    font_family = monospace
    color = rgba(120,120,120,ff)
    position = 0, -320
    halign = center
    valign = center
}
